# .github/workflows/build-android.yml
#
# CI: cross-compile the UPBGE blenderplayer for Android on every push to main
# and every tag matching v*, and upload the produced player bundle as a
# GitHub Actions artifact.
#
# Single target: arm64-v8a + player-only.
# Host: ubuntu-24.04 (has gcc-14 and clang-17 in the base repos; ubuntu-22.04
#       does NOT have gcc-14 without a PPA).
#
# The dependency prefix is cached per commit hash of every recipe file, so
# subsequent runs take ~30 min instead of hours.

name: build-android

on:
  workflow_dispatch:

jobs:
  build:
    name: player-only / arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      BUILD_BASE: ${{ github.workspace }}/_build_base
      UPBGE_SOURCE: ${{ github.workspace }}/upbge_src

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install host prerequisites (gcc-14, clang-17, cmake, ninja, JDK 17)
        run: bash scripts/setup_host.sh

      - name: Set up Android SDK + NDK r26d
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;r26d'

      - name: Configure environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/r26d" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/r26d" >> $GITHUB_ENV
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "BUILD_BASE=$BUILD_BASE" >> $GITHUB_ENV
          echo "UPBGE_SOURCE=$UPBGE_SOURCE" >> $GITHUB_ENV
          mkdir -p "$BUILD_BASE" "$UPBGE_SOURCE"

      - name: Cache dependency prefix
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_BASE }}/lib/android_arm64-v8a
          key: deps-arm64-v8a-player-only-${{ hashFiles('build_files/android/deps/**/*.sh') }}
          restore-keys: |
            deps-arm64-v8a-player-only-
            deps-arm64-v8a-

      - name: Fetch UPBGE source
        run: bash scripts/fetch_upbge.sh

      - name: Cross-compile dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          ARCH=arm64-v8a FEATURE=player-only \
            bash build_files/android/deps/build.sh

      - name: Build blenderplayer
        run: |
          python3 build_files/android/build.py player-only --arch arm64-v8a --repackage

      - name: Verify bundle
        run: |
          python3 scripts/verify_build.py --arch arm64-v8a -v \
            "$BUILD_BASE/android_apk_stage_player-only_arm64-v8a"

      - name: Upload player bundle
        uses: actions/upload-artifact@v4
        with:
          name: player_bundle_player-only_arm64-v8a
          path: |
            ${{ env.BUILD_BASE }}/apk/player_bundle_player-only_arm64-v8a-latest.tar.gz
            ${{ env.BUILD_BASE }}/logs/deps_arm64-v8a_player-only.log
          retention-days: 30
          compression-level: 0  # the tarball is already compressed

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUILD_BASE }}/apk/player_bundle_player-only_arm64-v8a-latest.tar.gz
          fail_on_unmatched_files: false
          
